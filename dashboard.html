<!doctype html>
<html><head>
<meta charset="utf-8">
<title>AI Team Mission Control</title>
<style>
:root{--bg:#0a0e14;--panel:#11161f;--panel2:#151b26;--border:#232b38;--fg:#d5dce6;--dim:#7d8899;
--green:#3fb950;--red:#f85149;--claude:#d97757;--codex:#74aa9c;--agy:#8ab4f8;--freebuff:#e3b341;--user:#c586c0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.5 "Segoe UI",system-ui;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex:0 0 auto}
header h1{font-size:14px;letter-spacing:.3px}
header .chip{display:flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--border);border-radius:20px;font-size:12px;background:var(--panel2)}
header .chip b{font-weight:600}
header a{color:var(--dim);text-decoration:none;font-size:12px}
header a:hover{color:var(--fg)}
#clock{margin-left:auto;color:var(--dim);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:#444c5a;flex:0 0 auto}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
main{display:grid;grid-template-columns:minmax(280px,340px) minmax(380px,1fr) minmax(380px,1fr);gap:10px;padding:10px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel>h2{font-size:11px;padding:9px 12px;border-bottom:1px solid var(--border);color:var(--dim);text-transform:uppercase;letter-spacing:.8px;flex:0 0 auto;display:flex;align-items:center;gap:8px}
.panel>h2 .count{margin-left:auto;color:var(--dim);font-weight:400;text-transform:none}
.body{overflow-y:auto;padding:10px;flex:1;min-height:0}
.body::-webkit-scrollbar{width:8px}
.body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}

.agent{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:7px;background:var(--panel2)}
.agent .info{flex:1;min-width:0}
.agent .name{font-weight:700;font-size:13px}
.agent .sub{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .stats{text-align:right;color:var(--dim);font-size:10.5px;line-height:1.4;flex:0 0 auto}
.agent button{margin-left:4px}

.run{padding:7px 10px;border-left:3px solid var(--border);margin-bottom:6px;cursor:pointer;border-radius:0 6px 6px 0;background:var(--panel2)}
.run:hover,.run.sel{background:#1b2330}
.run.sel{outline:1px solid var(--border)}
.run.running{border-left-color:var(--green)}
.run .l1{display:flex;gap:8px;align-items:baseline}
.run .who{font-weight:600;font-size:12px}
.run .when{color:var(--dim);font-size:10.5px;margin-left:auto}
.run .meta{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.entry{max-width:82%;margin:0 0 14px;display:flex;flex-direction:column}
.entry.out{margin-left:auto;align-items:flex-end}
.entry .head{display:flex;align-items:baseline;gap:8px;padding:0 4px 3px}
.entry .who{font-weight:600;font-size:11.5px}
.entry .ts{color:var(--dim);font-size:10px}
.entry .msg{padding:9px 13px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55;background:var(--panel2);border:1px solid var(--border);border-radius:14px 14px 14px 4px}
.entry.out .msg{border-radius:14px 14px 4px 14px;background:#1e2a3d}
.entry .msg.mono{font:11px/1.45 Consolas,monospace;color:#a8b3c1}
.entry.err .msg{border-color:#5b2a2e}
.entry.err .who::after{content:" · error";color:var(--red);font-weight:400;font-size:10px}
details.more summary{cursor:pointer;color:var(--dim);font-size:11px;padding:4px;user-select:none}
.b-claude .who{color:var(--claude)}.b-codex .who{color:var(--codex)}.b-agy .who{color:var(--agy)}
.b-freebuff .who{color:var(--freebuff)}.b-user .who{color:var(--user)}
.entry.logdump{display:none}
body.showlogs .entry.logdump{display:flex}
.n-claude{color:var(--claude)}.n-codex{color:var(--codex)}.n-agy{color:var(--agy)}.n-freebuff{color:var(--freebuff)}

pre{white-space:pre-wrap;word-break:break-word;font:11.5px/1.45 Consolas,monospace;color:#a8b3c1}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:5px 10px;border-bottom:1px solid var(--border);text-align:right}
td:first-child,th:first-child{text-align:left}
th{color:var(--dim);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:none}

form{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-top:1px solid var(--border);flex:0 0 auto;background:var(--panel)}
textarea{flex:1 1 100%;resize:vertical;min-height:44px;max-height:140px}
form select{flex:0 1 auto;min-width:70px}
form input{flex:1 1 90px;min-width:70px}
form button[type=submit],form button:last-child{flex:0 0 auto;background:#2ea04326;border-color:#2ea043;color:#3fb950}
input,select,textarea,button{background:#0d1320;color:var(--fg);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font:12.5px "Segoe UI",system-ui;outline:none}
input:focus,textarea:focus,select:focus{border-color:#3b4759}
button{cursor:pointer;background:#1d2634;font-weight:600}
button:hover{border-color:var(--dim)}
button.kill{color:var(--red);background:transparent;border:1px solid #402;border-radius:6px;padding:2px 8px;font-size:10.5px}
button.kill:hover{background:#2a1215}
#toast{position:fixed;bottom:16px;right:16px;background:#1d2634;border:1px solid var(--border);padding:9px 14px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:20px 0}
label.follow{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);margin-left:auto;text-transform:none;letter-spacing:0;cursor:pointer}
</style></head><body>
<header>
  <h1>🎛️ Mission Control</h1>
  <span class="chip" id="chip-claude"><span class="dot on"></span><b class="n-claude">claude</b></span>
  <span class="chip" id="chip-codex"><span class="dot"></span><b class="n-codex">codex</b></span>
  <span class="chip" id="chip-agy"><span class="dot"></span><b class="n-agy">agy</b></span>
  <span class="chip" id="chip-freebuff"><span class="dot"></span><b class="n-freebuff">freebuff</b></span>
  <a href="http://localhost:7778" target="_blank">freebuff terminal ↗</a>
  <span id="clock"></span>
</header>
<main>
  <div class="col">
    <div class="panel" style="flex:0 0 auto">
      <h2>Agents</h2>
      <div class="body" id="agents" style="padding-bottom:3px"></div>
    </div>
    <div class="panel" style="flex:1">
      <h2>Runs <span class="count" id="runcount"></span></h2>
      <div class="body" id="runs"></div>
      <form id="askform" title="Task an agent directly — runs outside Claude, logged to the board">
        <textarea id="f-prompt" placeholder="Task an agent directly… (bypasses Claude, still logged to board)"></textarea>
        <select id="f-agent"><option value="codex">codex</option><option value="agy">agy</option><option value="claude">claude (new instance · $)</option><option value="freebuff">freebuff</option></select>
        <select id="f-effort"><option value="">effort: default</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select>
        <input id="f-cwd" placeholder="cwd (optional)">
        <button>▶ Send</button>
      </form>
    </div>
  </div>
  <div class="panel">
    <h2>Team conversation <span class="count" id="feedcount"></span>
      <label class="follow"><input type="checkbox" onchange="document.body.classList.toggle('showlogs',this.checked); lastBoard=''"> show logs/errors</label>
    </h2>
    <div class="body" id="feed"></div>
  </div>
  <div class="col">
    <div class="panel" style="flex:1">
      <h2 id="logtitle">Live output <label class="follow"><input type="checkbox" id="follow" checked> follow</label></h2>
      <div class="body"><pre id="runlog">(select a run, or one auto-selects when an agent starts)</pre></div>
    </div>
    <div class="panel" style="flex:0 0 auto;max-height:34%">
      <h2>Usage ledger</h2>
      <div class="body" id="usage" style="padding:0"></div>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const AGENT_NAMES = ["claude","codex","agy","freebuff"];
let selected = null, userPicked = false, lastBoard = "";

function toast(m){ const t=$("toast"); t.textContent=m; t.className="show"; setTimeout(()=>t.className="",2500); }
function ago(ts){ const s=(Date.now()-new Date(ts))/1000; return s<60?Math.floor(s)+"s ago":s<3600?Math.floor(s/60)+"m ago":new Date(ts).toLocaleTimeString(); }
function agentOf(who){ // "claude → codex [test]" attributes the bubble to the SENDER
  const w = who.toLowerCase();
  if(w.includes("→")) return w.startsWith("user")?"user":"claude";
  for(const n of AGENT_NAMES) if(w.startsWith(n)) return n;
  return w.startsWith("user")?"user":"claude";
}
const looksLikeLog = (b) => /ERROR: Command failed|tokens used|^OpenAI Codex|hook: /m.test(b);

function renderAgents(s){
  $("agents").innerHTML = AGENT_NAMES.map(n=>{
    const runs = s.running.filter(x=>x.agent===n);
    const u = s.usage[n]||{calls:0,tokens:0,secs:0,errors:0};
    const busy = n==="claude" ? true : runs.length>0;
    const sub = n==="claude" ? "lead · this Claude Code session"
      : runs.length ? runs.map(r=>"⚙ "+(r.task_type||"task")+" · pid "+r.pid+" · "+r.cwd).join(" | ")
      : "idle";
    const kills = runs.map(r=>'<button class="kill" onclick="kill('+r.pid+')">kill '+r.pid+'</button>').join("");
    return '<div class="agent"><span class="dot'+(busy?" on":"")+'"></span>'
      + '<div class="info"><div class="name n-'+n+'">'+n+'</div><div class="sub" title="'+esc(sub)+'">'+esc(sub)+'</div></div>'
      + '<div class="stats">'+u.calls+' calls · '+(u.tokens||0).toLocaleString()+' tok<br>'+u.errors+' err · avg '+(u.calls?(u.secs/u.calls).toFixed(0):0)+'s</div>'
      + kills + '</div>';
  }).join("");
  for(const n of AGENT_NAMES){
    const busy = n==="claude" || s.running.some(x=>x.agent===n);
    $("chip-"+n).querySelector(".dot").className = "dot"+(busy?" on":"");
  }
}

function renderRuns(s){
  const startByRun = {};
  for(const e of s.events) if(e.ev==="start") startByRun[e.runId]=e;
  $("runcount").textContent = s.runs.length + " total · " + s.running.length + " running";
  $("runs").innerHTML = s.runs.map(r=>{
    const id = r.f.replace(".log","");
    const ev = startByRun[id];
    const running = s.running.some(x=>x.runId===id);
    const agent = ev?ev.agent:(id.split("-")[1]||"?");
    return '<div class="run'+(running?" running":"")+(selected===r.f?" sel":"")+'" onclick="pick(\''+r.f+'\',true)">'
      + '<div class="l1">'+(running?'<span class="spin">◐</span>':"")+'<span class="who n-'+agent+'">'+agent+'</span>'
      + '<span style="color:var(--dim);font-size:11px">'+(ev?esc((ev.source||"")+" · "+(ev.task_type||"task")):"")+'</span>'
      + '<span class="when">'+ago(Number(id.split("-")[0]))+'</span></div>'
      + '<div class="meta" title="'+(ev?esc(ev.prompt):"")+'">'+(ev?esc(ev.prompt.slice(0,90)):"(no event)")+'</div>'
      + (ev?'<div class="meta">📁 '+esc(ev.cwd)+' · '+(r.size/1024).toFixed(1)+'KB</div>':"")
      + '</div>';
  }).join("") || '<div class="empty">no runs yet</div>';
}

function renderFeed(s){
  if(s.board===lastBoard) return;
  lastBoard = s.board;
  const feed = $("feed");
  const atBottom = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 60;
  const entries = s.board.split(/^## /m).slice(1);
  $("feedcount").textContent = entries.length + " messages";
  feed.innerHTML = entries.map(m=>{
    const nl = m.indexOf("\n"), head = m.slice(0,nl), body = m.slice(nl+1).trim();
    const ts = (head.match(/\[(.*?)\]/)||[])[1]||"";
    const who = head.replace(/\[.*?\]\s*/,"").trim();
    const a = agentOf(who);
    const isErr = body.startsWith("ERROR");
    const mono = looksLikeLog(body);
    const out = who.includes("→"); // delegations (from user/claude) read as outgoing
    const dump = mono || isErr;    // raw logs/errors hidden unless "show logs"
    const short = body.length > 700;
    const shown = short ? body.slice(0,700) : body;
    return '<div class="entry b-'+a+(isErr?" err":"")+(out?" out":"")+(dump?" logdump":"")+'">'
      + '<div class="head"><span class="who">'+esc(who)+'</span><span class="ts">'+(ts?new Date(ts).toLocaleTimeString():"")+'</span></div>'
      + '<div class="msg'+(mono?" mono":"")+'">'+esc(shown)+'</div>'
      + (short?'<details class="more"><summary>show '+(body.length-700).toLocaleString()+' more chars…</summary><div class="msg'+(mono?" mono":"")+'">'+esc(body.slice(700))+'</div></details>':"")
      + '</div>';
  }).join("");
  if(atBottom) feed.scrollTop = feed.scrollHeight;
}

function renderUsage(s){
  const rows = Object.entries(s.usage);
  $("usage").innerHTML = "<table><tr><th>agent</th><th>calls</th><th>tokens</th><th>avg s</th><th>errors</th></tr>"
    + rows.map(([k,v])=>'<tr><td class="n-'+k+'" style="font-weight:600">'+k+"</td><td>"+v.calls+"</td><td>"+(v.tokens||0).toLocaleString()+"</td><td>"+(v.calls?(v.secs/v.calls).toFixed(0):0)+"</td><td>"+(v.errors||0)+"</td></tr>").join("")
    + "</table>";
}

async function tick(){
  try{
    const s = await (await fetch("/state")).json();
    $("clock").textContent = "live · " + new Date().toLocaleTimeString();
    // auto-select the newest running run unless the user picked one manually
    if(!userPicked && s.running.length){
      const newest = s.running[s.running.length-1];
      const f = newest.runId + ".log";
      if(selected !== f) pick(f, false);
    }
    renderAgents(s); renderRuns(s); renderFeed(s); renderUsage(s);
    if(selected){
      const t = await (await fetch("/runlog?f="+selected)).text();
      const el = $("runlog");
      if(el.textContent !== t){
        el.textContent = t || "(waiting for output…)";
        if($("follow").checked) el.parentElement.scrollTop = el.parentElement.scrollHeight;
      }
    }
  }catch(e){ $("clock").textContent = "⚠ disconnected"; }
}

function pick(f, manual){
  selected = f;
  if(manual) userPicked = true;
  $("logtitle").firstChild.textContent = "Live output — " + f.replace(".log","") + " ";
}
async function kill(pid){
  if(!confirm("Kill process "+pid+"?")) return;
  await fetch("/kill?pid="+pid,{method:"POST"});
  toast("kill signal sent to pid "+pid);
}
// Enter sends (Shift+Enter = newline)
$("f-prompt").addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("askform").requestSubmit(); }
});
$("askform").onsubmit = async (e)=>{
  e.preventDefault();
  const prompt = $("f-prompt").value.trim();
  if(!prompt) return;
  await fetch("/ask",{method:"POST",body:JSON.stringify({agent:$("f-agent").value,prompt,cwd:$("f-cwd").value.trim(),effort:$("f-effort").value})});
  $("f-prompt").value = "";
  userPicked = false; // follow the new run
  toast("sent to "+$("f-agent").value);
};
setInterval(tick, 2000); tick();
</script>
</body></html>
